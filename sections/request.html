<!-- نافذة طلب الخدمة -->
<div class="request-popup" id="requestPopup">
    <div class="request-box">
        <h2>طلب خدمة</h2>

        <form id="serviceForm">

            <!-- مفتاح Web3Forms -->
            <input type="hidden" name="access_key" value="1f3b2fdc-7941-4cd0-88c1-1e720971be3d">
            <input type="hidden" name="subject" value="طلب خدمة جديد من موقع ESSAM">
            <input type="hidden" name="from_name" value="ESSAM WEBSITE">

            <label>اسم العميل</label>
            <input type="text" name="name" placeholder="اكتب اسمك" required>

            <label>رقم التواصل</label>
            <input type="text" name="phone" placeholder="05xxxxxxxx" required>

            <label>نوع الخدمة</label>
            <select name="service" id="reqService" onchange="toggleOtherService()">
                <option value="تصميم نظام">تصميم نظام</option>
                <option value="قالب جاهز">قالب جاهز</option>
                <option value="متجر إلكتروني">متجر إلكتروني</option>
                <option value="موقع إلكتروني">موقع إلكتروني</option>
                <option value="other">أخرى</option>
            </select>

            <div id="otherServiceBox" style="display:none;">
                <label>اذكر نوع الخدمة</label>
                <input type="text" id="otherService" name="other_service" placeholder="اكتب نوع الخدمة المطلوبة">
            </div>

            <label>وصف مختصر</label>
            <textarea name="details" placeholder="اكتب تفاصيل الخدمة المطلوبة" required></textarea>

            <div class="req-buttons">
                <button type="submit" class="btn btn-primary">إرسال الطلب</button>
                <button type="button" class="btn btn-outline" onclick="closeRequest()">إغلاق</button>
            </div>

        </form>
    </div>
</div>

<!-- نافذة النجاح -->
<div class="success-popup" id="successPopup" style="display:none;">
    <div class="success-box">
        <h3>تم إرسال طلبك بنجاح</h3>
        <p>سيتم التواصل معك قريبًا</p>
        <button onclick="closeSuccess()" class="btn btn-primary">حسناً</button>
    </div>
</div>

<script>
function toggleOtherService() {
    const select = document.getElementById("reqService");
    const box = document.getElementById("otherServiceBox");
    box.style.display = select.value === "other" ? "block" : "none";
}

document.getElementById("serviceForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const form = e.target;
    const data = new FormData(form);

    const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: data
    });

    if (response.ok) {
        document.getElementById("requestPopup").style.display = "none";
        document.getElementById("successPopup").style.display = "flex";
        form.reset();
    } else {
        alert("حدث خطأ أثناء الإرسال، حاول مرة أخرى");
    }
});

function closeRequest() {
    document.getElementById("requestPopup").style.display = "none";
}

function closeSuccess() {
    document.getElementById("successPopup").style.display = "none";
}
</script>
